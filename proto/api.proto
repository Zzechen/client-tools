syntax = "proto3";
package clienttools;
option java_package = "com.clienttools.sdk.proto";
option java_multiple_files = true;
import "page.proto";
import "node.proto";
import "modify.proto";
import "mock.proto";
import "webview_redirect.proto";

message ResponseMeta {
  int32 code = 1;
  string message = 2;
  int32 sdk_version = 3;
  DeviceInfo device = 4;
}

message Empty {}

message ScreenState {
  bool is_awake  = 1;  // 屏幕是否点亮
  bool is_locked = 2;  // 锁屏是否锁定
}

message AppInfo {
  string package_name  = 1;
  string version_name  = 2;
  int32  version_code  = 3;
}

message DeviceInfoFull {
  float  screen_width_dp  = 1;
  float  screen_height_dp = 2;
  float  density          = 3;
  int32  screen_width_px  = 4;
  int32  screen_height_px = 5;
  string model            = 6;  // 设备型号，如 "Pixel 7" / "iPhone"
  int32  os_major_version = 7;  // Android API level 或 iOS 主版本号
  string os_version       = 8;  // OS 版本字符串，如 "14" / "17.5"
}

message InfoData {
  string         page_name = 1;
  ScreenState    screen    = 2;
  DeviceInfoFull device    = 3;
  AppInfo        app       = 4;
}

message InfoResponse { ResponseMeta meta = 1; InfoData data = 2; }

message PageResponse     { ResponseMeta meta = 1; PageInfo data = 2; }
message NodeResponse     { ResponseMeta meta = 1; Node data = 2; }
message NodeListResponse { ResponseMeta meta = 1; NodeList data = 2; }
message ModifyResponse   { ResponseMeta meta = 1; string message = 2; }
message ClickResponse    { ResponseMeta meta = 1; ClickResult data = 2; }
message ScrollResponse   { ResponseMeta meta = 1; ScrollResult data = 2; }
message SimpleResponse   { ResponseMeta meta = 1; }

message PushHtmlRequest  { string tag = 1; string timestamp = 2; bytes html = 3; }
message PushHtmlResult   { string tag = 1; string timestamp = 2; string file_path = 3; }
message PushHtmlResponse { ResponseMeta meta = 1; PushHtmlResult data = 2; }

message WebviewShowRequest   { string tag = 1; string timestamp = 2; }
message WebviewAdjustRequest { float offset_x = 1; float offset_y = 2; float opacity = 3; }

message CaptureResponse { ResponseMeta meta = 1; bytes image_png = 2; }

message MockRuleResponse      { ResponseMeta meta = 1; MockRule data = 2; }
message MockRuleListResponse  { ResponseMeta meta = 1; MockRuleList data = 2; }
message ClearMockRulesResponse { ResponseMeta meta = 1; int32 cleared_count = 2; }

message WebViewRedirectResponse      { ResponseMeta meta = 1; WebViewRedirectRule data = 2; }
message WebViewRedirectListResponse  { ResponseMeta meta = 1; WebViewRedirectRuleList data = 2; }
message ClearWebViewRedirectsResponse { ResponseMeta meta = 1; int32 cleared_count = 2; }
