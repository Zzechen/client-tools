syntax = "proto3";
package clienttools;
option java_package = "com.clienttools.sdk.proto";
option java_multiple_files = true;

message MockRule {
  string id                   = 1;
  string url                  = 2;
  string method               = 3;
  int64  delay_ms             = 4;
  string error                = 5;
  int32  status               = 6;
  map<string, string> headers = 7;
  string body                 = 8;
}

message AddMockRuleRequest {
  string url                  = 1;
  string method               = 2;
  int64  delay_ms             = 3;
  string error                = 4;
  int32  status               = 5;
  map<string, string> headers = 6;
  string body                 = 7;
}

message MockRuleList {
  repeated MockRule rules = 1;
}
