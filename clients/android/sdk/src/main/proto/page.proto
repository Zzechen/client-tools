syntax = "proto3";
package clienttools;
option java_package = "com.clienttools.sdk.proto";
option java_multiple_files = true;

message DeviceInfo {
  float screen_width_dp = 1;
  float screen_height_dp = 2;
  float density = 3;
}

message PageInfo {
  string page_name = 1;
  string timestamp = 2;
}

message PageChangedEvent {
  string page_name = 1;
  int64 timestamp = 2;
}
