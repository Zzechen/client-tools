name: ClientToolsDemo
options:
  bundleIdPrefix: com.clienttools
  deploymentTarget:
    iOS: "14.0"
targets:
  ClientToolsDemo:
    type: application
    platform: iOS
    sources:
      - Sources
    settings:
      base:
